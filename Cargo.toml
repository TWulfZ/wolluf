[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/chart",
    "crates/patterns",
    "crates/engine",
    "crates/source-osu",
    "crates/store",
    "crates/app",
    "apps/desktop/src-tauri",
    "apps/cli",
    "xtask",
]
# Standalone crate with its own [workspace]; it must stay outside so its deliberate lint violations never reach workspace builds (spec 001).
exclude = ["xtask/lint-canary"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false

# Single pin table for all of F0 (spec 001 Design, checked on crates.io 2026-09-28).
# Members only write `x.workspace = true`; check-layers L7 rejects local versions.
[workspace.dependencies]
wolluf-core = { path = "crates/core" }
wolluf-chart = { path = "crates/chart" }
wolluf-patterns = { path = "crates/patterns" }
wolluf-engine = { path = "crates/engine" }
wolluf-source-osu = { path = "crates/source-osu" }
wolluf-store = { path = "crates/store" }
wolluf-app = { path = "crates/app" }

# core
thiserror = "2.0.21"
serde = { version = "1.0.229", features = ["derive"] }
blake3 = "1.8.7"
libm = "0.2.16"

# codecs / hashing
md-5 = "0.11.0"
sha2 = "0.11.0"
zstd = "0.14.0"
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
rosu-map = "0.2.1"

# source-osu IO
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
winreg = "0.56.0"
notify = "8.2.0"
notify-debouncer-full = "0.7.0"

# store
rusqlite = { version = "0.40.2", features = ["bundled"] }
rusqlite_migration = "2.6.0"
crossbeam-channel = "0.5.17"

# app / jobs
tokio = "1.53.1"
tokio-util = "0.7.19"
rayon = "1.12.0"
uuid = { version = "1.26.1", features = ["v4"] }
ulid = "3.0.0"
directories = "6.0.0"
unicode-normalization = "0.1.25"
caseless = "0.2.2"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
tracing-appender = "0.2.5"
serde_json = "1.0.151"

# shells
tauri = "2.12.0"
tauri-build = "2.7.0"
tauri-plugin-dialog = "2.8.0"
tauri-plugin-opener = "2.6.0"
tauri-plugin-log = "2.10.0"
# Pre-releases get no semver protection, so they are pinned exactly.
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
specta-typescript = "0.0.12"
clap = { version = "4.6.7", features = ["derive", "env"] }
anyhow = "1.0.104"

# xtask
cargo_metadata = "0.23.1"
toml = "1.1.6"
regex = "1.13.1"

# tests
proptest = "1.11.0"
insta = "1.48.0"
trybuild = "1.0.121"
tempfile = "3.27.0"
assert_cmd = "2.2.2"
predicates = "3.1.4"

[workspace.lints.rust]
unsafe_code = "deny"
unreachable_pub = "warn"

# Stricter than architecture §7 on purpose: bins also use `?` + anyhow instead of unwrap/panic.
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
disallowed_types = "deny"
disallowed_methods = "deny"

# Recommended by the insta docs: snapshot diffing is slow unoptimized.
# No profile may set `panic = "abort"`: 003's per-item catch_unwind needs unwinding.
[profile.dev.package.insta]
opt-level = 3

[profile.dev.package.similar]
opt-level = 3
