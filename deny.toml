# cargo-deny 0.20 policy (architecture §3, D16; ADR 0008). CI runs `cargo deny check`.
# The licence allowlist is pinned by `deny_config::tests::allowlist_is_exact` in xtask.

[graph]
# Every feature: an optional feature must not be able to pull a banned licence in unnoticed.
all-features = true

[advisories]
# Both are "unmaintained" notices with no safe upgrade, reached only through pinned framework deps (ADR 0009).
ignore = [
    { id = "RUSTSEC-2024-0436", reason = "paste (unmaintained) comes only via specta =2.0.0-rc.25" },
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error (unmaintained) comes only via tauri 2.12 gtk/glib macros on Linux" },
]

[licenses]
# No GPL/LGPL/AGPL in-process. Unicode-3.0 comes with unicode-ident (every proc-macro);
# CC0-1.0 is the licence of notify 8.2.0 (spec 003).
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "MPL-2.0",
    "Zlib",
    "ISC",
    "Unicode-3.0",
    "CC0-1.0",
]
confidence-threshold = 0.93
exceptions = []
# The allowlist is policy for dependencies to come, so entries the current graph does not use yet are fine.
unused-allowed-license = "allow"

[licenses.private]
# Workspace crates are `publish = false` until the first release; their own licence is MIT (ADR 0008).
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
